# One certificate per workload, shared by its replicas: names are the
# Service names, the identity is the ServiceAccount's SPIFFE ID. Renewed 8h
# before the 24h expiry; a new key every renewal.
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    kubeca.effectivesecurity/enabled: "true"
---
apiVersion: kubeca.effectivesecurity/v1alpha1
kind: Certificate
metadata:
  name: web-tls
  namespace: shop
spec:
  issuerRef:
    name: kubeca
  profile: server-24h
  secretName: web-tls
  commonName: web.shop.svc.cluster.local
  dnsNames:
    - web.shop.svc.cluster.local
    - web.shop.svc
  uris:
    - spiffe://example.org/ns/shop/sa/web
  kubernetesNames:
    services: [web]
    includeUnqualified: true
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretTemplate:
    labels:
      app: web
