---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: certificates.kubeca.effectivesecurity
spec:
  group: kubeca.effectivesecurity
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    shortNames:
    - cert
    - certs
    singular: certificate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.secretName
      name: Secret
      type: string
    - jsonPath: .spec.issuerRef.name
      name: Issuer
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.notAfter
      name: Not After
      type: string
    - jsonPath: .status.renewalTime
      name: Renewal
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Certificate describes one certificate and the Secret that holds it; the
          Certificate controller issues, renews and re-issues it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CertificateSpec describes one certificate and the Secret
              that holds it.
            properties:
              commonName:
                description: |-
                  CommonName of the subject; not added to the SAN automatically. The
                  issuer policy checks it against allowedDNSNames.
                maxLength: 64
                type: string
              dnsNames:
                description: |-
                  DNSNames, IPAddresses, URIs and EmailAddresses are the subject
                  alternative names; validated with xpki csr.ParseSAN, duplicates
                  dropped.
                items:
                  type: string
                type: array
              duration:
                description: |-
                  Duration of the certificate; default the profile expiry. Bounded at
                  issuance by the profile expiry and the issuer policy's maxDuration.
                type: string
                x-kubernetes-validations:
                - message: duration must be at least 1m
                  rule: duration(self) >= duration('1m')
              emailAddresses:
                items:
                  type: string
                type: array
              ipAddresses:
                items:
                  type: string
                type: array
              issuerRef:
                description: IssuerRef names the ClusterIssuer that signs the certificate.
                properties:
                  name:
                    description: Name of the ClusterIssuer.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              kubernetesNames:
                description: KubernetesNames adds the names of Services in the namespace.
                properties:
                  includeClusterIP:
                    description: |-
                      IncludeClusterIP also adds the Services' cluster addresses (both
                      families of a dual-stack Service) as IP SANs.
                    type: boolean
                  includeUnqualified:
                    description: IncludeUnqualified also adds the `<svc>.<ns>.svc`
                      form.
                    type: boolean
                  services:
                    description: |-
                      Services in the same namespace whose DNS names (`<svc>.<ns>.svc.<domain>`)
                      are added; a missing Service is a PolicyViolation (ServiceNotFound).
                    items:
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    type: array
                type: object
              privateKey:
                description: PrivateKey parameters; default ECDSA P-256, rotated on
                  every issuance.
                properties:
                  algorithm:
                    default: ECDSA
                    description: Algorithm of the key; default ECDSA.
                    enum:
                    - ECDSA
                    - RSA
                    type: string
                  rotationPolicy:
                    default: Always
                    description: |-
                      RotationPolicy: Always (default) generates a new key for every
                      issuance; Never reuses the key stored in the Secret.
                    enum:
                    - Always
                    - Never
                    type: string
                  size:
                    description: |-
                      Size: the ECDSA curve (256, 384, 521) or the RSA modulus bits (2048,
                      3072, 4096); default 256 for ECDSA and 2048 for RSA.
                    enum:
                    - 256
                    - 384
                    - 521
                    - 2048
                    - 3072
                    - 4096
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: size must be 256, 384 or 521 for ECDSA and 2048, 3072 or
                    4096 for RSA
                  rule: '!has(self.size) || ((!has(self.algorithm) || self.algorithm
                    == ''ECDSA'') ? self.size in [256, 384, 521] : self.size in [2048,
                    3072, 4096])'
              profile:
                description: |-
                  Profile of the issuer; default the issuer's defaultProfile. It must
                  be one the ClusterIssuer exposes.
                type: string
              renewBefore:
                description: |-
                  RenewBefore is how long before notAfter the certificate is renewed;
                  default a third of the duration.
                type: string
                x-kubernetes-validations:
                - message: renewBefore must be at least 30s
                  rule: duration(self) >= duration('30s')
              secretName:
                description: SecretName of the kubernetes.io/tls Secret; default metadata.name.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
                x-kubernetes-validations:
                - message: secretName is immutable
                  rule: self == oldSelf
              secretTemplate:
                description: SecretTemplate adds labels and annotations to the Secret.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              uris:
                items:
                  type: string
                type: array
            required:
            - issuerRef
            type: object
            x-kubernetes-validations:
            - message: at least one name is required
              rule: (has(self.dnsNames) && size(self.dnsNames) > 0) || (has(self.ipAddresses)
                && size(self.ipAddresses) > 0) || (has(self.uris) && size(self.uris)
                > 0) || (has(self.emailAddresses) && size(self.emailAddresses) > 0)
                || (has(self.kubernetesNames) && has(self.kubernetesNames.services)
                && size(self.kubernetesNames.services) > 0)
            - message: renewBefore must be shorter than duration
              rule: '!has(self.renewBefore) || !has(self.duration) || duration(self.renewBefore)
                < duration(self.duration)'
            - message: secretName cannot be removed once set
              rule: '!has(oldSelf.secretName) || has(self.secretName)'
          status:
            description: CertificateStatus is the observed state of a Certificate.
            properties:
              conditions:
                description: |-
                  Conditions: Ready and Issuing. observedGeneration tracks
                  metadata.generation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failedAttempts:
                description: |-
                  FailedAttempts since the last successful issuance, with the time of
                  the last failure.
                format: int32
                type: integer
              issuerKeyID:
                type: string
              issuerLabel:
                description: IssuerLabel and IssuerKeyID identify the xpki issuer
                  that signed it.
                type: string
              lastFailureTime:
                format: date-time
                type: string
              lastRenewRequest:
                description: |-
                  LastRenewRequest is the renew-requested annotation value the last
                  issuance honoured.
                type: string
              notAfter:
                format: date-time
                type: string
              notBefore:
                description: NotBefore and NotAfter of the stored certificate.
                format: date-time
                type: string
              renewalTime:
                description: RenewalTime is notAfter − renewBefore − jitter.
                format: date-time
                type: string
              revision:
                description: Revision counts the issuances; the Secret carries the
                  same value.
                format: int64
                type: integer
              serialNumber:
                description: SerialNumber of the stored certificate, hex with colons.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
