# Step 2 of the shop demo: one Certificate per workload, shared by its
# replicas. The names are the Service names, the identity is the
# ServiceAccount's SPIFFE ID; renewed 8 h before the 24 h expiry with a new
# key. The Deployment mounts the Secret the Certificate controller
# maintains: no init container, the kubelet starts the Pod once the Secret
# exists and updates the mounted files in place on every renewal (do not
# use subPath). The application must reload tls.crt/tls.key when they
# change, for example with porto's tlsconfig.NewKeypairReloader, which the
# certmonitor container here uses to log the certificate and every renewal
# (kubectl -n shop logs deploy/web).
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: kubeca.effectivesecurity/v1alpha1
kind: Certificate
metadata:
  name: web-tls
  namespace: shop
spec:
  issuerRef:
    name: kubeca
  profile: server-24h
  secretName: web-tls
  commonName: web.shop.svc.cluster.local
  dnsNames:
    - web.shop.svc.cluster.local
    - web.shop.svc
  uris:
    - spiffe://cluster.local/ns/shop/sa/web
  kubernetesNames:
    services: [web]
    includeUnqualified: true
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretTemplate:
    labels:
      app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      volumes:
        - name: tls
          secret:
            secretName: web-tls
      containers:
        - name: web
          image: effectivesecurity/certmonitor:main
          imagePullPolicy: IfNotPresent
          args:
            - -cert=/etc/tls/tls.crt
            - -key=/etc/tls/tls.key
            - -root=/etc/tls/ca.crt
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: TLS_CERT_FILE
              value: /etc/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/tls.key
            - name: TLS_CA_FILE
              value: /etc/tls/ca.crt
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
