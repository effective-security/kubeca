# Test fixture of internal/testauthority: the short-lived profiles of the
# chart's examples/kubeca/etc/ca-config.kubeca.yaml (peer-24h, server-24h,
# client-24h, webhook) without the Helm templating, so the unit tests load
# them through authority.LoadConfig. Keep the profiles in step with the
# chart; the minikube e2e exercises the chart's own file.
#
# backdate stays at the 5m default: the operator sets NotBefore = now − backdate
# and NotAfter = NotBefore + duration, so the usable lifetime is duration − backdate.
---
authority:
  issuers:
    - label: kubeca.svc
      type: tls
      cert: ISSUER_CERT_FILE
      key: ISSUER_KEY_FILE
      ca_bundle: ""
      root_bundle: ROOT_BUNDLE_FILE
      aia:
        issuer_url:
        crl_url:
        ocsp_url:

profiles:
  peer-24h:
    issuer_label: kubeca.svc
    expiry: 24h
    backdate: 5m
    usages:
      - signing
      - key encipherment
      - server auth
      - client auth
    allowed_uri: ^spiffe://example\.org/ns/[a-z0-9-]+/sa/[a-z0-9-]+$
    allowed_dns: ^([a-z0-9-]+\.)+(svc|pod)(\.cluster\.local)?$|^localhost$
    allowed_fields:
      uri: true
      dns: true
      ip: true

  server-24h:
    issuer_label: kubeca.svc
    expiry: 24h
    backdate: 5m
    usages:
      - signing
      - key encipherment
      - server auth
    allowed_dns: ^([a-z0-9-]+\.)+(svc|pod)(\.cluster\.local)?$|^localhost$
    allowed_fields:
      uri: true
      dns: true
      ip: true

  client-24h:
    issuer_label: kubeca.svc
    expiry: 24h
    backdate: 5m
    usages:
      - signing
      - key encipherment
      - client auth
    allowed_uri: ^spiffe://example\.org/ns/[a-z0-9-]+/sa/[a-z0-9-]+$
    allowed_fields:
      uri: true

  # Serving certificate of the operator's own mutating webhook (D-6).
  webhook:
    issuer_label: kubeca.svc
    expiry: 168h
    backdate: 5m
    usages:
      - signing
      - key encipherment
      - server auth
    allowed_dns: ^kubeca-webhook\.kubeca\.svc(\.cluster\.local)?$
    allowed_fields:
      dns: true
