# DEPRECATED since v0.9: the init-container flow issues one certificate per
# Pod start and never renews it. New workloads use the operator: a
# Certificate mounted as a Secret (examples/shop/certificate.yaml) or
# the inject label (examples/shop/pod.yaml, deployment-injected.yaml).
# Dummy workload for the minikube test: a certmonitor container that logs
# the certificate the kubecertinit init container requested for the Pod.
# Needs examples/initcontainer/rbac.yaml (namespace shop, ServiceAccount web).
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      volumes:
        - name: tls
          emptyDir:
            medium: Memory
      initContainers:
        - name: certificate-init
          image: effectivesecurity/kubecertinit:main
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - -namespace=$(NAMESPACE)
            - -pod-name=$(POD_NAME)
            - -signer=kubeca.svc/peer
            - -cert-dir=/etc/tls
            - -cluster-domain=cluster.local
            - -query-k8s
            - -include-unqualified
            - -san=spiffe://cluster.local/ns/$(NAMESPACE)/sa/web,localhost,$(POD_IP)
            - -labels=app=web
            - -timeout=5m
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
      containers:
        - name: web
          image: effectivesecurity/certmonitor:main
          imagePullPolicy: IfNotPresent
          # the init container writes tls.key, tls.csr and tls.crt, no
          # ca.crt, and never renews: the monitor prints the certificate once
          args:
            - -cert=/etc/tls/tls.crt
            - -key=/etc/tls/tls.key
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
