{{- if $.Values.csrSigner.enabled }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "{{ printf "%s:csr-signer" (include "kubeca.serviceAccountName" $) }}"
  labels:
    {{- include "kubeca.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: "{{ include "kubeca.serviceAccountName" $ }}"
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kubeca:csr-signer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if $.Values.operator.enabled }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "{{ printf "%s:operator" (include "kubeca.serviceAccountName" $) }}"
  labels:
    {{- include "kubeca.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: "{{ include "kubeca.serviceAccountName" $ }}"
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kubeca:operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
