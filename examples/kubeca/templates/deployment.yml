---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeca.fullname" $ }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeca.labels" $ | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.default | default 1 }}
  selector:
    matchLabels:
      {{- include "kubeca.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app: kubeca
        {{- include "kubeca.selectorLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: "{{ include "kubeca.serviceAccountName" $ }}"
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector.default }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations.default }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity.default }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: kubeca
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          command:
            {{- toYaml $.Values.command | nindent 12 }}
            - -cluster-domain={{ $.Values.clusterDomain }}
            - -metrics-addr=:{{ $.Values.metricsPort }}
            - -health-probe-addr=:{{ $.Values.healthProbePort }}
            # always: the binary turns it on by itself in operator mode only,
            # and two CSR-signer-only replicas would both sign every CSR
            # (templates/role-leader-election.yaml grants the Lease)
            - -enable-leader-election
            {{- if $.Values.csrSigner.enabled }}
            - -approve={{ $.Values.csrSigner.approve }}
            - -approve-allowed-names={{ $.Values.csrSigner.allowedNames }}
            {{- else }}
            - -disable-csr-signer
            {{- end }}
            {{- if $.Values.operator.enabled }}
            - -enable-operator
            {{- if $.Values.operator.webhook.enabled }}
            - -enable-webhook
            - -webhook-port={{ $.Values.operator.webhook.port }}
            - -webhook-cert-dir=/kubeca/webhook
            - -webhook-service={{ include "kubeca.fullname" $ }}-webhook
            - -webhook-namespace={{ $.Release.Namespace }}
            - -webhook-signer={{ $.Values.operator.webhook.signer }}
            - -webhook-config={{ include "kubeca.webhookConfigName" $ }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $.Values.metricsPort }}
            - name: health
              containerPort: {{ $.Values.healthProbePort }}
            {{- if and $.Values.operator.enabled $.Values.operator.webhook.enabled }}
            - name: webhook
              containerPort: {{ $.Values.operator.webhook.port }}
            {{- end }}
          # ready once the webhook server accepts TLS connections (with the
          # webhook): a rollout keeps an old replica until then
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if $.Values.config.common }}
          envFrom:
            - configMapRef:
                name: {{ include "kubeca.fullname" $ }}-common
          {{- end }}

          volumeMounts:
          - name: "kubeca-etc-volume"
            mountPath: "/kubeca/etc"
            readOnly: true
          - name: "kubeca-certs-volume"
            mountPath: "/kubeca/certs"
            readOnly: true
          {{- if and $.Values.operator.enabled $.Values.operator.webhook.enabled }}
          - name: "kubeca-webhook-volume"
            mountPath: "/kubeca/webhook"
          {{- end }}
      volumes:
      - name: kubeca-certs-volume
        secret:
          secretName: {{ include "kubeca.certsSecretName" $ }}
      {{- if and $.Values.operator.enabled $.Values.operator.webhook.enabled }}
      - name: kubeca-webhook-volume
        emptyDir:
          medium: Memory
      {{- end }}

      - name: kubeca-etc-volume
        configMap:
          name: {{ include "kubeca.fullname" $ }}-etc
          items:
    {{- range $path, $_ :=  $.Files.Glob  "etc/*" }}
          - key: "{{ $path| base | replace "." "-" | replace "_" "-" }}"
            path: "{{ $path| base }}"
    {{- end }}
