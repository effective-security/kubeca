# A Pod with a known name gets its own certificate without the webhook: the
# Pod controller creates the Certificate `worker-1` owned by the Pod and the
# Secret `worker-1-tls`; the kubelet starts the container once the Secret
# exists. Names: the Pod IP and DNS name, the selecting Services, the
# ServiceAccount SPIFFE ID and the `san` annotation.
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-1
  namespace: shop
  labels:
    app: worker
    kubeca.effectivesecurity/inject: "true"
  annotations:
    kubeca.effectivesecurity/issuer: kubeca
    kubeca.effectivesecurity/profile: client-24h
    kubeca.effectivesecurity/san: localhost
spec:
  serviceAccountName: worker
  volumes:
    - name: tls
      secret:
        secretName: worker-1-tls
  containers:
    - name: worker
      image: example/worker:latest
      volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
